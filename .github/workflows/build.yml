name: Build

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - run: dotnet build 127c-encoder.csproj --configuration Release

  macos-package:
    name: macOS DMG (${{ matrix.rid }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15-intel
            rid: osx-x64
            arch: x86_64
          - os: macos-15
            rid: osx-arm64
            arch: arm64

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install fdkaac build tools
        run: brew install autoconf automake libtool pkg-config

      - name: Build macOS fdkaac
        run: bash scripts/build-fdkaac-macos.sh "$RUNNER_TEMP/fdkaac"

      - name: Publish application
        run: >
          dotnet publish 127c-encoder.csproj
          --configuration Release
          --runtime ${{ matrix.rid }}
          --self-contained true
          --output publish
          -p:UseAppHost=true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:PublishTrimmed=false
          -p:DebugType=None
          -p:DebugSymbols=false

      - name: Package and check mounted DMG
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/package-macos.sh 0.0.0-ci '${{ matrix.rid }}' publish "$RUNNER_TEMP/fdkaac" dist
          dmg="dist/127c-encoder-v0.0.0-ci-${{ matrix.rid }}.dmg"
          mount="$RUNNER_TEMP/127c-encoder-check"
          mkdir -p "$mount"
          hdiutil attach "$dmg" -mountpoint "$mount" -nobrowse -readonly
          trap 'hdiutil detach "$mount"' EXIT
          app="$mount/127c-encoder.app"
          test -L "$mount/Applications"
          test -x "$app/Contents/MacOS/127c-encoder"
          test -f "$app/Contents/Resources/encoder/FDK-AAC-NOTICE"
          plutil -lint "$app/Contents/Info.plist"
          codesign --verify --deep --strict "$app"
          help_output="$("$app/Contents/Resources/encoder/fdkaac" --help 2>&1 || true)"
          grep -qi fdkaac <<< "$help_output"
          lipo -archs "$app/Contents/MacOS/127c-encoder" | grep -qw '${{ matrix.arch }}'
          lipo -archs "$app/Contents/Resources/encoder/fdkaac" | grep -qw '${{ matrix.arch }}'

      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.rid }}-dmg
          path: dist/*.dmg
          if-no-files-found: error
