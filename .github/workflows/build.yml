name: Build

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - run: dotnet build 127c-encoder.csproj --configuration Release

  bundle-fdkaac:
    name: Bundle fdkaac (${{ matrix.rid }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
          - os: windows-11-arm
            rid: win-arm64
          - os: ubuntu-latest
            rid: linux-x64
          - os: ubuntu-24.04-arm
            rid: linux-arm64

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Stage and smoke test fdkaac
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/bundle-fdkaac.py --rid ${{ matrix.rid }} --publish-dir publish --smoke

  macos-package:
    name: macOS DMG (${{ matrix.rid }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15-intel
            rid: osx-x64
            arch: x86_64
          - os: macos-15
            rid: osx-arm64
            arch: arm64

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install fdkaac build tools
        run: brew install autoconf automake libtool pkg-config

      - name: Build macOS fdkaac
        run: bash scripts/build-fdkaac-macos.sh "$RUNNER_TEMP/fdkaac"

      - name: Check pinned FFmpeg on Monterey
        if: matrix.rid == 'osx-x64'
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/ffmpeg.zip"
          curl -fsSL --retry 3 \
            'https://ffmpeg.martin-riedl.de/download/macos/amd64/1783018342_8.1.2/ffmpeg.zip' \
            -o "$archive"
          echo "a52ef43883f44c219766d4b3bdde4e635b35465d0b704c01c3a0566b59775df9  $archive" | shasum -a 256 -c -
          unzip -q "$archive" -d "$RUNNER_TEMP/ffmpeg-check"
          binary="$(find "$RUNNER_TEMP/ffmpeg-check" -type f -name ffmpeg -print -quit)"
          test -n "$binary"
          xcrun vtool -show-build "$binary"

      - name: Publish application
        run: >
          dotnet publish 127c-encoder.csproj
          --configuration Release
          --runtime ${{ matrix.rid }}
          --self-contained true
          --output publish
          -p:MacOSLegacyTarget=true
          -p:UseAppHost=true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:PublishTrimmed=false
          -p:DebugType=None
          -p:DebugSymbols=false

      - name: Package and check mounted DMG
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/package-macos.sh 0.0.0-ci '${{ matrix.rid }}' publish "$RUNNER_TEMP/fdkaac" dist
          dmg="dist/127c-encoder-v0.0.0-ci-${{ matrix.rid }}.dmg"
          mount="$RUNNER_TEMP/127c-encoder-check"
          mkdir -p "$mount"
          hdiutil attach "$dmg" -mountpoint "$mount" -nobrowse -readonly
          trap 'hdiutil detach "$mount"' EXIT
          app="$mount/127c-encoder.app"
          test -L "$mount/Applications"
          test -x "$app/Contents/MacOS/127c-encoder"
          test -f "$app/Contents/Resources/encoder/FDK-AAC-NOTICE"
          plutil -lint "$app/Contents/Info.plist"
          codesign --verify --deep --strict "$app"
          help_output="$("$app/Contents/Resources/encoder/fdkaac" --help 2>&1 || true)"
          grep -qi fdkaac <<< "$help_output"
          lipo -archs "$app/Contents/MacOS/127c-encoder" | grep -qw '${{ matrix.arch }}'
          lipo -archs "$app/Contents/Resources/encoder/fdkaac" | grep -qw '${{ matrix.arch }}'

      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.rid }}-dmg
          path: dist/*.dmg
          if-no-files-found: error
