name: Build

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04-arm

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - run: dotnet build 127c-encoder.csproj --configuration Release --runtime linux-arm64

      - run: dotnet run --project tests/RegressionTests.csproj --configuration Release
