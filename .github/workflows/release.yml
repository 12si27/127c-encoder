name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "프로그램 및 릴리스 버전 (예: 1.2.3 또는 1.2.3-beta.1)"
        required: true
        type: string
      prerelease:
        description: "사전 릴리스로 표시"
        required: true
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  prepare:
    name: Validate release version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.normalize.outputs.version }}
      tag: ${{ steps.normalize.outputs.tag }}

    steps:
      - name: Normalize version
        id: normalize
        shell: bash
        env:
          RAW_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          version="${RAW_VERSION#v}"

          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?(\+[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]]; then
            echo "버전은 1.2.3 또는 1.2.3-beta.1 형식이어야 합니다." >&2
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.name }}
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
            name: Windows x64
          - os: windows-latest
            rid: win-arm64
            name: Windows ARM64
          - os: ubuntu-latest
            rid: linux-x64
            name: Linux x64
          - os: ubuntu-latest
            rid: linux-arm64
            name: Linux ARM64
          - os: macos-15-intel
            rid: osx-x64
            name: macOS x64
          - os: macos-15
            rid: osx-arm64
            name: macOS ARM64
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Publish self-contained application
        if: runner.os != 'macOS'
        run: >
          dotnet publish 127c-encoder.csproj
          --configuration Release
          --runtime ${{ matrix.rid }}
          --self-contained true
          --output publish
          -p:UseAppHost=true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:PublishTrimmed=false
          -p:DebugType=None
          -p:DebugSymbols=false
          -p:ContinuousIntegrationBuild=true
          -p:Version=${{ needs.prepare.outputs.version }}
          -p:InformationalVersion=${{ needs.prepare.outputs.version }}
          -p:IncludeSourceRevisionInInformationalVersion=false

      - name: Publish macOS application for Monterey and later
        if: runner.os == 'macOS'
        run: >
          dotnet publish 127c-encoder.csproj
          --configuration Release
          --runtime ${{ matrix.rid }}
          --self-contained true
          --output publish
          -p:MacOSLegacyTarget=true
          -p:UseAppHost=true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:PublishTrimmed=false
          -p:DebugType=None
          -p:DebugSymbols=false
          -p:ContinuousIntegrationBuild=true
          -p:Version=${{ needs.prepare.outputs.version }}
          -p:InformationalVersion=${{ needs.prepare.outputs.version }}
          -p:IncludeSourceRevisionInInformationalVersion=false

      - name: Set up Python for dependency packaging
        if: runner.os != 'macOS'
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Bundle verified fdkaac dependency
        if: runner.os != 'macOS'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/bundle-fdkaac.py --rid ${{ matrix.rid }} --publish-dir publish --smoke

      - name: Install macOS fdkaac build tools
        if: runner.os == 'macOS'
        run: brew install autoconf automake libtool pkg-config

      - name: Build macOS fdkaac
        if: runner.os == 'macOS'
        shell: bash
        run: bash scripts/build-fdkaac-macos.sh "$RUNNER_TEMP/fdkaac"

      - name: Package macOS DMG
        if: runner.os == 'macOS'
        shell: bash
        run: |
          dotnet nuget locals all --clear
          bash scripts/package-macos.sh \
            '${{ needs.prepare.outputs.version }}' \
            '${{ matrix.rid }}' \
            publish "$RUNNER_TEMP/fdkaac" .

      - name: Package Windows build
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $packageName = '127c-encoder-${{ needs.prepare.outputs.tag }}-${{ matrix.rid }}'
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          Move-Item publish "dist/$packageName"
          Compress-Archive -Path "dist/$packageName" -DestinationPath "$packageName.zip"

      - name: Package Linux build
        if: runner.os == 'Linux'
        shell: bash
        run: |
          package_name='127c-encoder-${{ needs.prepare.outputs.tag }}-${{ matrix.rid }}'
          mkdir -p dist
          mv publish "dist/$package_name"
          cd dist
          zip -r "../$package_name.zip" "$package_name"

      - name: Upload release asset
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.rid }}
          path: |
            127c-encoder-${{ needs.prepare.outputs.tag }}-${{ matrix.rid }}.zip
            127c-encoder-${{ needs.prepare.outputs.tag }}-${{ matrix.rid }}.dmg
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: [prepare, build]
    runs-on: ubuntu-latest

    steps:
      - name: Download release assets
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Create release and upload builds
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: 127c-encoder ${{ needs.prepare.outputs.tag }}
          target_commitish: ${{ github.sha }}
          prerelease: ${{ inputs.prerelease }}
          generate_release_notes: true
          files: |
            release-assets/*.zip
            release-assets/*.dmg
